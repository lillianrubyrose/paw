[workspace]
resolver = "3"
members = [
    "crates/paw-classfile-format"
, "crates/paw-classfile-lir", "crates/paw-mutf8", "crates/paw_bin"]

[workspace.package]
version = "0.0.1-dev"
edition = "2024"

[workspace.dependencies]
byteorder = "1.5.0"
thiserror = "1.0.69"
eyre = "0.6.12"
color-eyre = "0.6.5"
bytemuck = {version = "1.24.0", features = ["derive", "min_const_generics"]}
